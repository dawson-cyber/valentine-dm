<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> prenom💗</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffccd5 0%, #ffb3c6 50%, #ff8fab 100%);
    font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
}

.floating-hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.floating-heart {
    position: absolute;
    font-size: 24px;
    opacity: 0.3;
    animation: float 15s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
    10% { opacity: 0.3; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-100px) rotate(360deg) scale(0.5); opacity: 0; }
}

.container {
    background: rgba(255, 255, 255, 0.95);
    padding: clamp(30px, 5vw, 50px);
    border-radius: clamp(20px, 4vw, 30px);
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    width: min(90%, 400px);
    z-index: 10;
    position: relative;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    animation: slideIn 0.6s ease-out;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(-50px); }
    to { opacity: 1; transform: translateX(0); }
}

h2 {
    color: #ff4d6d;
    font-size: clamp(1.8rem, 4vw, 2.2rem);
    margin-bottom: clamp(20px, 4vw, 30px);
    font-weight: 700;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
}

.subtitle {
    color: #666;
    font-size: clamp(0.9rem, 2vw, 1rem);
    margin-bottom: 25px;
    line-height: 1.5;
}

.form-group {
    margin-bottom: clamp(25px, 5vw, 35px);
}

input {
    width: 100%;
    padding: clamp(12px, 3vw, 16px);
    border-radius: 15px;
    border: 2px solid #ff8fab;
    font-size: clamp(16px, 2vw, 18px);
    text-align: center;
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
}

input:focus {
    outline: none;
    border-color: #ff4d6d;
    box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.2);
    transform: scale(1.02);
}

input::placeholder {
    color: #ff8fab;
    opacity: 0.7;
}

button {
    width: 100%;
    padding: clamp(14px, 3vw, 18px);
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff4d6d, #ff1e4d);
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: clamp(16px, 2vw, 18px);
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
    position: relative;
    overflow: hidden;
}

button:before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: 0.5s;
}

button:hover:before { left: 100%; }

button:hover {
    background: linear-gradient(135deg, #ff1e4d, #e60039);
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(255, 77, 109, 0.4);
}

button:active {
    transform: translateY(1px);
    box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
}

.heart-icon {
    font-size: clamp(2.5rem, 6vw, 3.5rem);
    margin-bottom: clamp(15px, 3vw, 25px);
    animation: heartbeat 1.5s ease-in-out infinite;
    display: inline-block;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

/* Message d'erreur */
.error-message {
    display: none;
    color: #ff3333;
    font-size: 0.9rem;
    margin-top: 10px;
    animation: shake 0.4s ease;
}

.error-message.visible {
    display: block;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
}

.mobile-instructions {
    display: none;
    color: #666;
    font-size: 0.85rem;
    margin-top: 15px;
    font-style: italic;
}

@media (max-width: 400px) {
    body { padding: 10px; }
    .container { width: 95%; padding: 25px 20px; }
    .mobile-instructions { display: block; }
}

@media (min-width: 768px) and (max-width: 1024px) {
    .container { width: min(70%, 450px); padding: 40px; }
    h2 { font-size: 2.5rem; }
    input, button { font-size: 20px; padding: 18px; }
}

@media (min-width: 1025px) {
    .container { width: min(30%, 450px); }
    .container:hover { transform: translateY(-5px); transition: transform 0.3s ease; }
}

@media (min-width: 1440px) {
    .container { width: min(25%, 500px); padding: 60px; }
    h2 { font-size: 2.8rem; }
}

@media (max-height: 600px) and (orientation: landscape) {
    body { padding: 10px; min-height: auto; }
    .container { width: min(80%, 500px); padding: 25px; margin: 20px auto; }
    h2 { font-size: 1.8rem; margin-bottom: 15px; }
    .form-group { margin-bottom: 20px; }
}

@media (prefers-color-scheme: dark) {
    .container { background: rgba(30, 30, 30, 0.95); color: #fff; border-color: rgba(255, 255, 255, 0.1); }
    h2 { color: #ff8fab; }
    input { background: rgba(255, 255, 255, 0.1); border-color: #ff4d6d; color: #fff; }
    input::placeholder { color: #ffb3c6; }
    .subtitle { color: #ccc; }
}
</style>
</head>

<body>

<div class="floating-hearts" id="floatingHearts"></div>

<div class="container">
    <div class="heart-icon">💗</div>
    
    <h2>Entre ton prénom</h2>
    
    <p class="subtitle">Pour une surprise spéciale 💖</p>
    
    <form action="ours.html" method="GET" id="prenomForm">
        <div class="form-group">
            <input type="text" 
                   name="username" 
                   id="prenomInput"
                   placeholder="Ton prénom..." 
                   required
                   autocomplete="off"
                   autocapitalize="words">
            <p class="error-message" id="errorMsg">Ce n'est pas toi,je veux Myriam !!!</p>
        </div>
        
        <button type="submit" id="submitBtn">
            Appuieee 💝
        </button>
    </form>
    
    <p class="mobile-instructions">Tape ton prénom et appuie sur le bouton rose !</p>
</div>

<script>
// Générer des cœurs flottants
const floatingHearts = document.getElementById('floatingHearts');
const heartEmojis = ['💖', '💗', '💓', '💕', '💞'];

for (let i = 0; i < 15; i++) {
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = Math.random() * 100 + '%';
    heart.style.animationDelay = Math.random() * 15 + 's';
    heart.style.fontSize = Math.random() * 20 + 20 + 'px';
    floatingHearts.appendChild(heart);
}

// Focus automatique sur desktop
if (window.innerWidth > 768) {
    document.getElementById('prenomInput').focus();
}

// ✅ Fonction de vérification du prénom
function verifierPrenom(prenom) {
    const prenomNettoye = prenom.trim().toLowerCase();
    return prenomNettoye === 'myriam';
}

// Gestion de la soumission du formulaire
document.getElementById('prenomForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const input = document.getElementById('prenomInput');
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('submitBtn');
    const prenom = input.value;

    // Vérification prénom vide
    if (prenom.trim().length === 0) {
        input.style.borderColor = '#ff3333';
        input.placeholder = 'Entre ton prénom ici !';
        setTimeout(() => {
            input.style.borderColor = '#ff8fab';
            input.placeholder = 'Ton prénom...';
        }, 2000);
        return;
    }

    // ✅ Vérification que le prénom est bien Myriam
    if (!verifierPrenom(prenom)) {
        input.style.borderColor = '#ff3333';
        input.style.boxShadow = '0 0 0 3px rgba(255, 51, 51, 0.2)';

        // Afficher le message d'erreur avec animation
        errorMsg.classList.remove('visible');
        void errorMsg.offsetWidth; // reset animation
        errorMsg.classList.add('visible');

        setTimeout(() => {
            input.style.borderColor = '#ff8fab';
            input.style.boxShadow = 'none';
            errorMsg.classList.remove('visible');
        }, 3000);
        return;
    }

    // ✅ Prénom correct : animation puis redirection
    errorMsg.classList.remove('visible');
    input.style.borderColor = '#00cc66';
    btn.innerHTML = 'on attend...';
    btn.style.background = 'linear-gradient(135deg, #00cc66, #00b359)';

    setTimeout(() => {
        btn.innerHTML = 'C\'est bon ! 🎉';
    }, 800);

    setTimeout(() => {
        document.getElementById('prenomForm').submit();
    }, 1200);
});

// Effet de saisie
const input = document.getElementById('prenomInput');
input.addEventListener('input', function() {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.remove('visible');
    this.style.borderColor = this.value.length > 0 ? '#ff4d6d' : '#ff8fab';
    this.style.boxShadow = 'none';
});
</script>

</body>
</html>
