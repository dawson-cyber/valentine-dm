<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😢 Oh non...</title>
<style>
/* Reset et base responsive */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 50%, #f1b0b7 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  position: relative;
  padding: 20px;
}

/* Fond avec effet de pluie triste */
.rain-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.container {
  text-align: center;
  z-index: 10;
  background: rgba(255, 255, 255, 0.95);
  padding: clamp(30px, 5vw, 50px) clamp(20px, 5vw, 70px);
  border-radius: clamp(20px, 4vw, 30px);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  border: 2px solid rgba(255, 255, 255, 0.5);
  width: min(95%, 800px);
  animation: fadeIn 1.5s ease-out;
  position: relative;
  overflow: hidden;
  margin: 20px 0;
}

.container:before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: clamp(6px, 1vw, 8px);
  background: linear-gradient(90deg, #ff4d6d, #ff8fab);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

.sad-face {
  font-size: clamp(3.5rem, 10vw, 5rem);
  margin-bottom: clamp(15px, 3vw, 20px);
  animation: sadBounce 2s ease-in-out infinite;
  text-shadow: 0 5px 15px rgba(0,0,0,0.2);
  display: inline-block;
}

@keyframes sadBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.1); }
}

h1 {
  color: #444;
  font-size: clamp(1.8rem, 5vw, 3.2rem);
  text-align: center;
  margin-bottom: clamp(25px, 4vw, 40px);
  line-height: 1.3;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
  position: relative;
  padding-bottom: clamp(15px, 3vw, 20px);
}

h1:after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 10%;
  width: 80%;
  height: 3px;
  background: linear-gradient(90deg, transparent, #ff4d6d, transparent);
}

.message {
  color: #666;
  font-size: clamp(1rem, 2vw, 1.4rem);
  margin-bottom: clamp(30px, 4vw, 40px);
  line-height: 1.6;
  max-width: 600px;
  font-weight: 300;
  margin-left: auto;
  margin-right: auto;
}

.buttons {
  display: flex;
  gap: clamp(15px, 3vw, 25px);
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: clamp(20px, 3vw, 30px);
}

button {
  padding: clamp(14px, 2.5vw, 18px) clamp(25px, 4vw, 40px);
  border: none;
  border-radius: clamp(20px, 4vw, 25px);
  font-weight: bold;
  font-size: clamp(1rem, 2vw, 1.2rem);
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  position: relative;
  overflow: hidden;
  min-width: min(200px, 90vw);
  flex: 1;
  max-width: 300px;
}

button:before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: 0.5s;
}

button:hover:before {
  left: 100%;
}

#yes-btn {
  background: linear-gradient(135deg, #ff4d6d, #ff1e4d);
  color: white;
}

#yes-btn:hover {
  background: linear-gradient(135deg, #ff1e4d, #e60039);
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 15px 30px rgba(255, 30, 77, 0.3);
}

#no-btn {
  background: linear-gradient(135deg, #6c757d, #495057);
  color: white;
}

#no-btn:hover {
  background: linear-gradient(135deg, #495057, #343a40);
  transform: translateY(-5px);
}

/* Larmes qui tombent - responsive */
.tear {
  position: absolute;
  width: clamp(4px, 1vw, 8px);
  height: clamp(8px, 2vw, 15px);
  background: #a8d0e6;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  opacity: 0;
  animation: tearFall 3s linear infinite;
  z-index: 1;
}

@keyframes tearFall {
  0% {
    transform: translateY(-100px) scale(0.5);
    opacity: 0;
  }
  10% {
    opacity: 0.7;
  }
  90% {
    opacity: 0.7;
  }
  100% {
    transform: translateY(100vh) scale(0.5);
    opacity: 0;
  }
}

/* Cœurs brisés - responsive */
.broken-heart {
  position: absolute;
  font-size: clamp(20px, 4vw, 30px);
  opacity: 0;
  z-index: 1;
  animation: breakHeart 4s linear infinite;
}

@keyframes breakHeart {
  0% {
    transform: translateY(-100px) rotate(0deg);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

/* Nuages de pluie - responsive */
.rain-cloud {
  position: absolute;
  top: -50px;
  width: clamp(100px, 20vw, 150px);
  height: clamp(40px, 8vw, 60px);
  background: #b0bec5;
  border-radius: 50%;
  opacity: 0.3;
  z-index: 1;
}

.rain-cloud:before, .rain-cloud:after {
  content: '';
  position: absolute;
  background: #b0bec5;
  border-radius: 50%;
}

.rain-cloud:before {
  width: clamp(60px, 12vw, 80px);
  height: clamp(60px, 12vw, 80px);
  top: clamp(-30px, -6vw, -40px);
  left: clamp(15px, 3vw, 20px);
}

.rain-cloud:after {
  width: clamp(40px, 8vw, 60px);
  height: clamp(40px, 8vw, 60px);
  top: clamp(-20px, -4vw, -30px);
  right: clamp(15px, 3vw, 20px);
}

/* Cœurs qui s'estompent */
.fading-heart {
  position: absolute;
  font-size: clamp(25px, 6vw, 40px);
  opacity: 0;
  animation: fadeHeart 6s linear infinite;
}

@keyframes fadeHeart {
  0% {
    opacity: 0;
    transform: scale(0.5);
  }
  50% {
    opacity: 0.3;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(0.5);
  }
}

.counter-message {
  margin-top: clamp(20px, 3vw, 30px);
  color: #888;
  font-size: clamp(0.85rem, 2vw, 1rem);
  font-style: italic;
  text-align: center;
  padding: 0 10px;
}

/* Responsive spécifique pour très petits écrans */
@media (max-width: 480px) {
  .container {
    padding: 25px 20px;
    border-radius: 20px;
  }
  
  .buttons {
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  
  button {
    width: 100%;
    max-width: 280px;
  }
  
  h1:after {
    left: 5%;
    width: 90%;
  }
  
  .message {
    font-size: 1.1rem;
  }
}

/* Mode paysage sur mobile */
@media (max-height: 600px) and (orientation: landscape) {
  body {
    padding: 10px;
    min-height: auto;
  }
  
  .container {
    margin: 10px auto;
    padding: 20px 30px;
    max-height: 90vh;
    overflow-y: auto;
  }
  
  .sad-face {
    font-size: 3rem;
    margin-bottom: 10px;
  }
  
  h1 {
    font-size: 1.8rem;
    margin-bottom: 15px;
    padding-bottom: 10px;
  }
  
  .message {
    font-size: 1rem;
    margin-bottom: 20px;
  }
  
  .buttons {
    margin-bottom: 15px;
  }
  
  button {
    padding: 12px 25px;
    font-size: 1rem;
  }
}

/* Pour tablettes */
@media (min-width: 768px) and (max-width: 1024px) {
  .container {
    width: min(90%, 700px);
    padding: 40px 50px;
  }
  
  h1 {
    font-size: 2.8rem;
  }
  
  .message {
    font-size: 1.3rem;
  }
  
  button {
    font-size: 1.3rem;
    padding: 16px 35px;
  }
}

/* Pour ordinateurs */
@media (min-width: 1025px) {
  .container {
    width: min(80%, 900px);
  }
  
  .container:hover {
    transform: translateY(-5px);
    transition: transform 0.3s ease;
  }
}

/* Support du thème sombre */
@media (prefers-color-scheme: dark) {
  .container {
    background: rgba(40, 40, 40, 0.95);
    color: #f0f0f0;
    border-color: rgba(255, 255, 255, 0.1);
  }
  
  h1 {
    color: #f0f0f0;
  }
  
  .message {
    color: #ccc;
  }
  
  .counter-message {
    color: #aaa;
  }
  
  #no-btn {
    background: linear-gradient(135deg, #555, #333);
  }
  
  #no-btn:hover {
    background: linear-gradient(135deg, #444, #222);
  }
}

/* Animation pour le fadeOut */
@keyframes fadeOut {
  from { opacity: 0.7; transform: scale(1); }
  to { opacity: 0; transform: scale(1.5); }
}

/* Pour éviter les débordements horizontaux */
html, body {
  max-width: 100%;
  overflow-x: hidden;
}

/* Optimisation des animations pour mobile */
@media (prefers-reduced-motion: reduce) {
  .sad-face,
  .tear,
  .broken-heart,
  .fading-heart {
    animation: none;
  }
  
  button:hover {
    transform: none;
  }
}

/* Correction pour les écrans très étroits */
@media (max-width: 350px) {
  .container {
    padding: 20px 15px;
  }
  
  h1 {
    font-size: 1.6rem;
  }
  
  .message {
    font-size: 1rem;
  }
  
  button {
    font-size: 0.95rem;
    padding: 12px 20px;
  }
}
</style>
</head>
<body>

<div class="rain-background" id="rainBackground"></div>

<div class="container">
  <div class="sad-face">😢</div>
  <h1>Un non ?</h1>
  
  <div class="message">
   Tu as tes raisons sur le non et je comprends, je respecte ta décision<br>
    Mais peut-être que tu veux reconsidérer ta décision ?
  </div>
  
  <div class="buttons">
    <button id="yes-btn">Je change d'avis ! 💖</button>
    <button id="no-btn">Je suis sûre... 😔</button>
  </div>
  
  <div class="counter-message" id="counter">Tu as cliqué "Non" 0 fois... mon cœur se brise un peu plus à chaque fois</div>
</div>

<script>
// Fonction pour créer des éléments d'animation responsive
function createResponsiveElement(className, properties) {
  const element = document.createElement('div');
  element.className = className;
  
  // Appliquer les propriétés
  Object.keys(properties).forEach(key => {
    if (key === 'style') {
      Object.keys(properties.style).forEach(styleKey => {
        element.style[styleKey] = properties.style[styleKey];
      });
    } else if (key === 'innerHTML') {
      element.innerHTML = properties.innerHTML;
    }
  });
  
  return element;
}

// Créer des larmes qui tombent
const rainBackground = document.getElementById('rainBackground');
for(let i = 0; i < 15; i++) {
  const tear = createResponsiveElement('tear', {
    style: {
      left: Math.random() * 100 + '%',
      animationDelay: Math.random() * 3 + 's',
      width: Math.random() * 4 + 3 + 'px',
      height: Math.random() * 8 + 8 + 'px'
    }
  });
  rainBackground.appendChild(tear);
}

// Créer des cœurs brisés
for(let i = 0; i < 8; i++) {
  const heart = createResponsiveElement('broken-heart', {
    innerHTML: '💔',
    style: {
      left: Math.random() * 100 + '%',
      animationDelay: Math.random() * 4 + 's',
      fontSize: Math.random() * 15 + 15 + 'px',
      color: '#ff4d6d'
    }
  });
  rainBackground.appendChild(heart);
}

// Cœurs qui s'estompent
for(let i = 0; i < 10; i++) {
  const heart = createResponsiveElement('fading-heart', {
    innerHTML: '💔',
    style: {
      left: Math.random() * 100 + '%',
      top: Math.random() * 100 + '%',
      animationDelay: Math.random() * 6 + 's',
      color: '#ff8fab'
    }
  });
  rainBackground.appendChild(heart);
}

// Nuages de pluie
for(let i = 0; i < 4; i++) {
  const cloud = createResponsiveElement('rain-cloud', {
    style: {
      left: Math.random() * 100 + '%',
      opacity: Math.random() * 0.2 + 0.1,
      transform: `scale(${Math.random() * 0.5 + 0.5})`
    }
  });
  rainBackground.appendChild(cloud);
}

// Bouton "Oui"
document.getElementById('yes-btn').addEventListener('click', function() {
  this.innerHTML = "Hourra ! Retour au bonheur 💖";
  this.style.background = "linear-gradient(135deg, #00cc66, #00b359)";
  this.style.transform = "scale(1.1)";
  
  // Ajouter des cœurs joyeux
  for(let i = 0; i < 15; i++) {
    const heart = document.createElement('div');
    heart.innerHTML = '💖';
    heart.style.position = 'fixed';
    heart.style.left = Math.random() * 100 + '%';
    heart.style.top = Math.random() * 100 + '%';
    heart.style.fontSize = Math.random() * 20 + 15 + 'px';
    heart.style.opacity = '0.7';
    heart.style.zIndex = '100';
    heart.style.animation = 'fadeOut 2s forwards';
    document.body.appendChild(heart);
    
    setTimeout(() => heart.remove(), 2000);
  }
  
  setTimeout(() => {
    window.location.href = 'oui.html';
  }, 1500);
});

// Compteur de clics sur "Non"
let noCount = 0;
const counterElement = document.getElementById('counter');
const messages = [
  "Tu as cliqué 'Non' 0 fois... mon cœur se brise un peu plus à chaque fois",
  "1 refus... la déception commence",
  "2 refus... ça fait mal",
  "3 refus... pourquoi tant de cruauté ?",
  "4 refus... chaque clic est une petite mort",
  "5 refus... mon cœur est en mille morceaux",
  "6 refus... je commence à perdre espoir",
  "7 refus... la tristesse m'envahit",
  "8 refus... plus que de la douleur maintenant",
  "9 refus... je vais finir en larmes",
  "10 refus... c'est trop, je suis brisé mais ça va quand même"
];

function moveButton() {
  noCount++;
  const noBtn = document.getElementById('no-btn');
  
  // Mettre à jour le message
  const messageIndex = Math.min(noCount, messages.length - 1);
  counterElement.textContent = messages[messageIndex];
  
  // Calculer la position maximale disponible
  const container = document.querySelector('.container');
  const containerRect = container.getBoundingClientRect();
  
  // Déplacer le bouton aléatoirement dans le conteneur
  const maxX = containerRect.width - noBtn.offsetWidth - 20;
  const maxY = containerRect.height - noBtn.offsetHeight - 20;
  
  const randomX = Math.max(10, Math.random() * maxX);
  const randomY = Math.max(10, Math.random() * maxY);
  
  noBtn.style.position = 'absolute';
  noBtn.style.left = randomX + 'px';
  noBtn.style.top = randomY + 'px';
  
  // Changement de texte progressif
  const sadTexts = [
    "Je suis sûr... 😔",
    "Vraiment ? 😟",
    "Sans hésitation ? 😥",
    "C'est ton dernier mot ? 😭",
    "Tu ne regrettes pas ? 💔",
    "Pitié... 🥺",
    "Arrête ça 😢",
    "Tu es cruel 😭",
    "Mon cœur saigne 💔",
    "Je meurs à petit feu et c'est drôle"
  ];
  
  if (noCount < sadTexts.length) {
    noBtn.innerHTML = sadTexts[noCount];
  }
  
  // Ajouter une larme supplémentaire
  const tear = createResponsiveElement('tear', {
    style: {
      left: Math.random() * 100 + '%',
      animationDelay: '0s',
      width: '6px',
      height: '12px'
    }
  });
  rainBackground.appendChild(tear);
  
  // Si trop de clics, forcer le "oui"
  if (noCount >= 10) {
    setTimeout(() => {
      alert("D'accord, d'accord ! Je vais considérer que c'est un OUI mais avec un goût amer de non! 💖");
      window.location.href = 'oui.html';
    }, 500);
  }
}

// Initialiser l'événement click sur le bouton "Non"
document.getElementById('no-btn').addEventListener('click', moveButton);

// Animation de larmes au survol du titre (uniquement sur desktop)
if (window.innerWidth > 768) {
  document.querySelector('h1').addEventListener('mouseover', function() {
    for(let i = 0; i < 3; i++) {
      const tear = createResponsiveElement('tear', {
        style: {
          left: (50 + Math.random() * 20 - 10) + '%',
          animationDelay: '0s',
          width: '6px',
          height: '12px'
        }
      });
      rainBackground.appendChild(tear);
    }
  });
}

// Optimisation pour les performances sur mobile
let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
if (isMobile) {
  // Réduire le nombre d'animations sur mobile
  const animations = document.querySelectorAll('.tear, .broken-heart, .fading-heart');
  animations.forEach((anim, index) => {
    if (index > 15) {
      anim.style.display = 'none';
    }
  });
}

// Redimensionnement responsive
function handleResize() {
  const noBtn = document.getElementById('no-btn');
  if (noBtn.style.position === 'absolute') {
    // Réinitialiser la position si le bouton est déplacé
    noBtn.style.position = '';
    noBtn.style.left = '';
    noBtn.style.top = '';
  }
}

// Écouter le redimensionnement
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', function() {
  setTimeout(handleResize, 100);
});

// Ajouter l'animation fadeOut au DOM
const style = document.createElement('style');
style.textContent = `
  @keyframes fadeOut {
    from { opacity: 0.7; transform: scale(1); }
    to { opacity: 0; transform: scale(1.5); }
  }
`;
document.head.appendChild(style);
</script>

</body>
</html>
