<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Entre ton prénom 💗</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(180deg,#ffccd5,#ffb3c6);
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,0.15);
    width:300px;
}

h2{
    color:#ff4d6d;
}

input{
    width:80%;
    padding:12px;
    border-radius:15px;
    border:1px solid #ff4d6d;
    margin-top:15px;
    text-align:center;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:20px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#ff1e4d;
}
</style>
</head>

<body>

<div class="container">
    <h2>Entre ton prénom 💗</h2>

    <form action="ours.html" method="GET">
        <input type="text" name="username" placeholder="Ton prénom..." required>
        <br>
        <button type="submit">Entrer</button>
    </form>

</div>

</body>
</html>
