<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Oui ! 💖</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffccd5 0%, #ff8fab 50%, #ff4d6d 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  position: relative;
}

.container {
  text-align: center;
  z-index: 10;
  position: relative;
  padding: 40px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  border-radius: 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  border: 2px solid rgba(255, 255, 255, 0.3);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

h1 {
  color: white;
  font-size: 4.5rem;
  text-align: center;
  text-shadow: 0 0 20px #e60039, 0 0 40px #ff1e4d;
  margin: 0;
  padding: 20px;
  letter-spacing: 2px;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #e60039, 0 0 20px #ff1e4d; }
  to { text-shadow: 0 0 20px #e60039, 0 0 40px #ff1e4d, 0 0 60px #ff4d6d; }
}

.subtitle {
  color: white;
  font-size: 2rem;
  margin-top: 20px;
  opacity: 0.9;
  font-weight: 300;
  animation: fadeIn 2s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 0.9; transform: translateY(0); }
}

.message {
  color: white;
  font-size: 1.5rem;
  margin-top: 30px;
  padding: 20px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  max-width: 600px;
  line-height: 1.6;
}

.heart-burst {
  position: absolute;
  font-size: 30px;
  animation: burst 1.5s ease-out forwards;
  z-index: 1;
}

@keyframes burst {
  0% {
    transform: translate(0, 0) scale(1) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translate(var(--x), var(--y)) scale(0) rotate(720deg);
    opacity: 0;
  }
}

.floating-hearts {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.floating-heart {
  position: absolute;
  font-size: 40px;
  opacity: 0;
  animation: floatUp 8s linear infinite;
}

@keyframes floatUp {
  0% {
    transform: translateY(100vh) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    transform: translateY(-100px) rotate(360deg);
    opacity: 0;
  }
}

.sparkle {
  position: absolute;
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 50%;
  animation: sparkle 1s ease-out infinite;
  box-shadow: 0 0 10px 2px white;
}

@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1); }
}

.confetti {
  position: absolute;
  width: 15px;
  height: 15px;
  opacity: 0;
  animation: confettiFall 3s linear infinite;
}

@keyframes confettiFall {
  0% {
    transform: translateY(-100px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

.return-button {
  margin-top: 40px;
  padding: 15px 40px;
  background: linear-gradient(135deg, #ff4d6d, #ff1e4d);
  color: white;
  border: none;
  border-radius: 50px;
  font-size: 1.2rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(255, 30, 77, 0.3);
}

.return-button:hover {
  transform: scale(1.1);
  box-shadow: 0 15px 30px rgba(255, 30, 77, 0.5);
  background: linear-gradient(135deg, #ff1e4d, #e60039);
}

.return-button:active {
  transform: scale(0.95);
}
</style>
</head>
<body>

<div class="container">
  <h1>💖 Elle a dit OUI ! 💖</h1>
  <div class="subtitle">Le plus beau "oui" du monde !</div>
  <div class="message">
    Une histoire d'amour commence aujourd'hui...<br>
    Que chaque jour soit rempli de rires, de câlins<br>
    et de moments magiques ensemble !
  </div>
  <button class="return-button" onclick="window.location.href='index.html'">← Retour à la carte</button>
</div>

<div class="floating-hearts" id="floatingHearts"></div>

<script>
// Explosion de cœurs
for(let i = 0; i < 80; i++){
  const heart = document.createElement("div");
  heart.className = "heart-burst";
  heart.innerText = "💖";
  heart.style.left = window.innerWidth/2 + "px";
  heart.style.top = window.innerHeight/2 + "px";
  heart.style.color = getRandomColor();
  heart.style.setProperty("--x", (Math.random()*1000-500) + "px");
  heart.style.setProperty("--y", (Math.random()*-800-200) + "px");
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1500);
}

// Cœurs flottants
const floatingHearts = document.getElementById("floatingHearts");
for(let i = 0; i < 20; i++){
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.innerText = ["💖", "💗", "💓", "💕"][Math.floor(Math.random()*4)];
  heart.style.left = Math.random() * 100 + "%";
  heart.style.color = getRandomColor();
  heart.style.animationDelay = Math.random() * 5 + "s";
  heart.style.fontSize = (Math.random() * 30 + 20) + "px";
  floatingHearts.appendChild(heart);
}

// Confettis
for(let i = 0; i < 100; i++){
  const confetti = document.createElement("div");
  confetti.className = "confetti";
  confetti.style.left = Math.random() * 100 + "%";
  confetti.style.backgroundColor = getRandomColor();
  confetti.style.animationDelay = Math.random() * 3 + "s";
  confetti.style.width = Math.random() * 15 + 5 + "px";
  confetti.style.height = Math.random() * 15 + 5 + "px";
  document.body.appendChild(confetti);
}

// Étincelles autour du texte
for(let i = 0; i < 50; i++){
  const sparkle = document.createElement("div");
  sparkle.className = "sparkle";
  sparkle.style.left = Math.random() * 100 + "%";
  sparkle.style.top = Math.random() * 100 + "%";
  sparkle.style.animationDelay = Math.random() * 2 + "s";
  document.body.appendChild(sparkle);
}

// Musique d'ambiance (optionnelle)
function playCelebrationSound() {
  // Créer un contexte audio simple pour des bips festifs
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // Do
    oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // Mi
    oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // Sol
    
    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.5);
  } catch (e) {
    console.log("Audio non supporté ou bloqué");
  }
}

// Jouer le son au chargement
setTimeout(playCelebrationSound, 500);

// Fonction pour générer des couleurs aléatoires pastel
function getRandomColor() {
  const colors = [
    "#ff4d6d", "#ff8fab", "#ffccd5", "#ffb3c6",
    "#ff6b9d", "#ff85a1", "#ff477e", "#ff5d8f",
    "#ff97b7", "#ffacc5", "#ffcad4"
  ];
  return colors[Math.floor(Math.random() * colors.length)];
}

// Message de félicitations qui change toutes les 3 secondes
const messages = [
  "Votre histoire d'amour vient de commencer !",
  "Que la magie de l'amour vous accompagne toujours",
  "Félicitations pour ce magnifique début !",
  "L'aventure la plus belle est celle qui commence",
  "Soyez heureux à jamais !"
];

const messageElement = document.querySelector('.message');
let messageIndex = 0;

setInterval(() => {
  messageIndex = (messageIndex + 1) % messages.length;
  messageElement.style.opacity = 0;
  setTimeout(() => {
    messageElement.innerHTML = messages[messageIndex] + "<br>💖💖💖";
    messageElement.style.opacity = 1;
    messageElement.style.transition = "opacity 0.5s";
  }, 500);
}, 3000);
</script>

</body>
</html>
